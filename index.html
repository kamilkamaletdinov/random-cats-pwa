<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ff6b9d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Котики" />
    <meta name="description" content="Случайные фото и GIF с котиками" />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="icon" href="icon-192.png" type="image/png" />
    <link rel="stylesheet" href="styles.css" />

    <title>Случайные котики</title>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>Случайный котик</h1>
        <p>Случайные фото и GIF с котиками</p>
      </header>

      <div class="tabs" role="tablist" aria-label="Тип изображения">
        <button
          id="photo-tab"
          class="tab"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="media-panel"
          data-mode="photo"
        >
          📷 Фото
        </button>
        <button
          id="gif-tab"
          class="tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="media-panel"
          data-mode="gif"
          tabindex="-1"
        >
          🎞️ GIF
        </button>
      </div>

      <section
        id="media-panel"
        class="photo-card"
        role="tabpanel"
        aria-labelledby="photo-tab"
        aria-live="polite"
      >
        <div class="image-frame">
          <img id="cat-image" alt="Случайное фото кошки" />
          <div id="loading" class="loading" role="status">Ищем котика…</div>
        </div>
        <p id="caption" class="caption"></p>
      </section>

      <button id="next-button" class="next-button" type="button">
        🎲 <span id="next-button-label">Ещё фото</span>
      </button>

      <p id="error-message" class="error-message" role="alert" hidden></p>
      <p class="install-hint">
        В Safari нажмите «Поделиться» → «На экран „Домой”»
      </p>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
